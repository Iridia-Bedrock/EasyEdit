#English language file
#Author: platz1de (FAWE Style)
#Last updated at: 2024-03-05
message-version: "3.0.5"

#If you want to include double quotes (") in your messages please escape them with a backslash (\")

prefix: '§8(§4§lFAWE§8)§r§7 '

#Args: {x} {y} {z}
#The regions argument on selected-pos2 reports the number of completed areas.
selected-pos1: "First position set to ({x}, {y}, {z})."
selected-pos2: "Second position set to ({x}, {y}, {z}). You now have {regions} selected region(s)."

additional-selection-started: "Additional region started at ({x}, {y}, {z}). Right-click a block to finish it."
wand-given: "§aWooden Axe equipped. §7Left-click: corner 1 · right-click: corner 2 · sneak + left-click: add a region · sneak + drop: clear selection."
deselected: "All selected regions cleared."
selection-adjusted: "Adjusted {regions} selected region(s)."
chunk-selected: "Selected {regions} chunk(s)."
selection-type-set: "Selection mode set to {type}. Left-click to start, then right-click to define or extend the selection."
polygon-point-added: "Polygon point {points} added at ({x}, {y}, {z}). Add at least three non-collinear points to define the region."

no-selection: "Select one or more regions first."
no-clipboard: "Your clipboard is empty. Copy something first."

#Args: {given} {expected}
wrong-selection: "Your selection is of type {given}, but {expected} is required."

no-history: "No undo history available."
no-future: "No redo history available."

no-task: "No active task is currently running."
task-cancelled: "Current task was cancelled."
task-cancelled-self: "Your task was cancelled."

#Args: {usage}
wrong-usage: "Description: {usage}"

#Args: {usage} {flag}
unknown-flag: "Unknown flag: {flag}\nUsage: {usage}"

#Args: {commands} {start} {end} {total}
command-list: "Commands (showing {start} to {end} of {total}):\n{commands}"

#Args: {message}
task-crash: "§cAn error occurred while executing the task:\n{message}"
pattern-invalid: "§cInvalid pattern format:\n{message}"

#Args: {time} {changed}
blocks-set: "Operation completed! {changed} blocks have been changed ({time}s)."
blocks-copied: "{changed} blocks have been copied ({time}s)."
blocks-pasted: "{changed} blocks have been pasted ({time}s)."
blocks-rotated: "{changed} blocks have been rotated ({time}s)."
blocks-flipped: "{changed} blocks have been flipped ({time}s)."
blocks-cut: "{changed} blocks have been cut ({time}s)."

#Args: {time} {changed} {blocks}
blocks-counted: "Counted {changed} blocks in {time}s:\n{blocks}"

#Args: {time} {changed} {name}
schematic-created: "Schematic saved as \"{name}\" ({changed} blocks, {time}s)."

#Args: {task} {queue} {status} {progress} {storage} {mem_current} {mem_max}
thread-stats: "FAWE EditThread Status:\nStatus: {status}\nCurrent Task: {task}\nProgress: {progress}\nQueued tasks: {queue}\nStored selections: {storage}\nThread memory: {mem_current}MB ({mem_max}MB)"

benchmark-start: "Benchmark started, this can take a few minutes..."
benchmark-running: "A benchmark is already running."

#Args: {done} {total}
benchmark-progress: "Benchmark progress: {done}/{total}"

#Args: {tps_avg} {tps_min} {load_avg} {load_max} {tasks} {time} {results}
benchmark-finished: "Benchmark results:\nAverage TPS: {tps_avg} ({load_avg}%)\nMinimal TPS: {tps_min} ({load_max}%)\nExecuted {tasks} tasks in {time}s:\n{results}"

#Args: {task} {name} {time} {blocks}
benchmark-result: "#{task}: {name} - {blocks} in {time}s"

#Args: {state} {id} {meta} {name} {x} {y} {z} {java_state}
block-info: "{name} ({id}:{meta}) at {x} {y} {z}\nBlock state: {state}\nJava state: {java_state}"

#Args: {schematic} {known}
unknown-schematic: "Unknown schematic \"{schematic}\".\nKnown schematics: {known}"

#Commands
#Note: If command usages contains a short description, it should be spilt with a "-" (e.g. "help - Show this help")

command-pos1-description: "Set the first corner of the current region"
command-pos1-usage: "//pos1 [x] [y] [z]"
command-pos2-description: "Set the second corner of the current region"
command-pos2-usage: "//pos2 [x] [y] [z]"
command-hpos1-description: "Set the first selection point at the block you're looking at"
command-hpos1-usage: "//hpos1"
command-hpos2-description: "Set the second selection point at the block you're looking at"
command-hpos2-usage: "//hpos2"
command-deselect-description: "Clear all selected regions"
command-deselect-usage: "//deselect"
command-sel-description: "Clear the selection or choose a selection shape"
command-sel-usage: "//sel [cuboid|extend|sphere|ellipsoid|cylinder|poly]"
command-chunk-description: "Select the chunk or chunks containing the target coordinates or selection"
command-chunk-usage:
  - "//chunk - Select the chunk you are standing in"
  - "//chunk <x> <y> <z> - Select the chunk containing these block coordinates"
  - "//chunk -c <chunk-x> <chunk-z> - Select a chunk by chunk coordinates"
  - "//chunk -s - Select every chunk intersecting your current selection"
command-extend-description: "Extend every selected region"
command-extend-usage:
  - "//extend [direction] [count]"
  - "//extend [count] - Extend every selected region into your looking direction"
  - "//extend vertical - Fully extend every selected region vertically"
  - "//extend --min <x>,<y>,<z> --max <x>,<y>,<z> - Modify every selected region by the given vectors"
command-shift-description: "Move every selected region without moving its blocks"
command-shift-usage: "//shift <amount> [direction]"
command-expand-description: "Expand every selected region toward a direction"
command-expand-usage: "//expand <amount> [reverse-amount] [direction] | //expand vert"
command-contract-description: "Contract every selected region toward a direction"
command-contract-usage: "//contract <amount> [reverse-amount] [direction]"
command-inset-description: "Contract every selected region on all sides"
command-inset-usage: "//inset [-h] [-v] <amount>"
command-outset-description: "Expand every selected region on all sides"
command-outset-usage: "//outset [-h] [-v] <amount>"
command-set-description: "Set blocks in every selected region"
command-set-usage: "//set <pattern>"
command-replace-description: "Replace blocks in every selected region"
command-replace-usage:
  - "//replace <block> <pattern>"
  - "//replace <pattern> - Replace all solid blocks in every selected region"
command-overlay-description: "Overlay the top layer of every selected region"
command-overlay-usage: "//overlay <pattern>"
command-naturalize-description: "Naturalize every selected region (dirt, grass, stone)"
command-naturalize-usage: "//naturalize [pattern] [pattern] [pattern]"
command-smooth-description: "Smooth the elevation in every selected region"
command-smooth-usage: "//smooth"
command-center-description: "Set the center block(s) of every selected region"
command-center-usage: "//center [pattern]"
command-walls-description: "Build walls around every selected region"
command-walls-usage: "//walls [pattern]"
command-sides-description: "Build the sides of every selected region"
command-sides-usage: "//sides [pattern]"
command-move-description: "Move every selected region"
command-move-usage:
  - "//move [direction] [count]"
  - "//move [count] - Move every selected region into your looking direction"
  - "//move -v <x>,<y>,<z> - Move every selected region by the given vector"
command-stack-description: "Repeat/stack every selected region"
command-stack-usage:
  - "//stack [direction] [count]"
  - "//stack [count] - Stack every selected region into your looking direction"
command-istack-description: "Stack every selected region without overwriting existing blocks"
command-istack-usage:
  - "//istack [direction] [count]"
  - "//istack [count] - Stack every selected region into your looking direction"
command-count-description: "Count blocks in every selected region"
command-count-usage:
  - "//count"
  - "//count -d - Count blocks and show detailed block state information"
  - "//count [radius] - Count blocks in the area around you"
command-extinguish-description: "Extinguish fires nearby"
command-extinguish-usage:
  - "//extinguish"
  - "//extinguish [radius] - Extinguish fire in the area around you"
command-view-description: "Show boundaries of every selected region"
command-view-usage: "//view"

command-undo-description: "Undo recent changes"
command-undo-usage:
  - "//undo [count]"
  - "//undo <target> [count] - Revert the latest change of the target"
command-redo-description: "Redo undone changes"
command-redo-usage:
  - "//redo [count]"
  - "//redo <target> [count] - Redo the latest change of the target"

command-copy-description: "Copy all selected regions to the clipboard"
command-copy-usage:
  - "//copy - Copy relative to the player"
  - "//copy -c - Copy relative to the center of all selected regions"
command-cut-description: "Cut all selected regions to the clipboard"
command-cut-usage:
  - "//cut - Cut relative to the player"
  - "//cut -c - Cut relative to the center of all selected regions"
command-paste-description: "Paste clipboard contents"
command-paste-usage: "//paste"
command-insert-description: "Insert clipboard contents"
command-insert-usage: "//insert"
command-merge-description: "Merge clipboard with existing blocks (ignore air)"
command-merge-usage: "//merge"
command-rpaste-description: "Paste clipboard replacing everything"
command-rpaste-usage: "//rpaste"
command-rotate-description: "Rotate the clipboard contents"
command-rotate-usage: "//rotate"
command-flip-description: "Flip the clipboard contents"
command-flip-usage:
  - "//flip [direction]"
  - "//flip - Flip the clipboard into your looking direction"
command-loadschematic-description: "Load a schematic file"
command-loadschematic-usage: "//loadschematic <schematicName>"
command-saveschematic-description: "Save clipboard as a schematic file"
command-saveschematic-usage: "//saveschematic <schematicName>"

command-sphere-description: "Generate a solid sphere"
command-sphere-usage: "//sphere <radius> <pattern>"
command-hsphere-description: "Generate a hollow sphere"
command-hsphere-usage: "//hsphere <radius> <pattern> [thickness]"
command-cylinder-description: "Generate a solid cylinder"
command-cylinder-usage: "//cylinder <radius> <height> <pattern>"
command-hcylinder-description: "Generate a hollow cylinder"
command-hcylinder-usage: "//hcylinder <radius> <height> <pattern> [thickness]"
command-noise-description: "Generate terrain using noise in every selected region"
command-noise-usage: "//noise"
command-cube-description: "Generate a solid cube"
command-cube-usage: "//cube <size> <pattern>"
command-hcube-description: "Generate a hollow cube"
command-hcube-usage: "//hcube <size> <pattern> [thickness]"

command-commands-description: "List available commands"
command-commands-usage: "//commands [page]"
command-brush-description: "Configure a terrain brush"
command-brush-usage:
  - "//brush sphere [radius] [pattern] [gravity] - Create a spherical brush"
  - "//brush smooth [radius] - Create a smoothing brush"
  - "//brush naturalize [radius] [topBlock] [middleBlock] [bottomBlock] - Create a naturalize brush"
  - "//brush cylinder [radius] [height] [pattern] [gravity] - Create a cylindrical brush"
  - "//brush paste [insert] - Create a pasting brush"
command-fill-description: "Flood-fill an area"
command-fill-usage:
  - "//fill <block> [direction]"
  - "//fill <block> - Fill into your looking direction"
command-drain-description: "Drain fluids nearby"
command-drain-usage: "//drain"
command-line-description: "Draw a line of blocks"
command-line-usage:
  - "//line <x> <y> <z> [pattern] - Draw a direct line to given position"
  - "//line find <x> <y> <z> [pattern] - Find a valid path to the destination (slow)"
  - "//line solid <x> <y> <z> [pattern] - Find a solid path to the destination (slow)"
command-blockinfo-description: "Inspect block data on click"
command-blockinfo-usage: "//blockinfo"
command-builderrod-description: "Get a builder wand/rod"
command-builderrod-usage: "//builderrod"
command-wand-description: "Get the selection wand"
command-wand-usage: "//wand - In creative, left-click the first corner and right-click the second; sneak + left-click adds another region"
command-status-description: "Check FAWE queue and thread performance"
command-status-usage: "//status"
command-cancel-description: "Cancel your active editing task"
